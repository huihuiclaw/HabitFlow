name: HabitFlow
options:
  bundleIdPrefix: com.habitflow
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    CODE_SIGN_ENTITLEMENTS: HabitFlow/HabitFlow.entitlements

targets:
  HabitFlow:
    type: application
    platform: iOS
    sources:
      - path: HabitFlow
        type: group
        excludes:
          - "HabitFlowWidget/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habitflow.app
        INFOPLIST_KEY_CFBundleDisplayName: HabitFlow
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: ""

  HabitFlowWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HabitFlow/HabitFlowWidget
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habitflow.app.widget
        INFOPLIST_FILE: HabitFlow/HabitFlowWidget/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: HabitFlow/HabitFlowWidget/HabitFlowWidget.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: HabitFlow/HabitFlowWidget/HabitFlowWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.habitflow.app